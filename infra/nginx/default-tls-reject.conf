# Shared host hygiene: reject HTTPS for names this box does not serve.
#
# Not part of the oddfusion.ai site. It is here because adding oddfusion.ai
# exposed the problem: before this block, an HTTPS request for any unmatched
# name fell through to the first TLS server block and was answered with
# tenkif.com's certificate. A visitor typing a wrong name got a certificate
# warning naming an unrelated business, and anyone pointing a domain at this
# IP got a real-looking TLS endpoint for free.
#
# `ssl_reject_handshake` (nginx >= 1.19.4; this box runs 1.24.0) refuses the TLS
# handshake outright for unmatched SNI, so no certificate is presented and no
# certificate needs to exist for this block.
#
# This only affects names that match NO other server_name. tenkif.com,
# tripplansai.com, oddfusion.ai and their www forms all match their own blocks
# and are unaffected.
#
# Port 80 already has a default_server in sites-available/default and is left
# alone.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_reject_handshake on;
}
