# ODD FUSION — bootstrap server block (HTTP only).
#
# Purpose: exist just long enough to get a certificate. `certbot certonly
# --webroot` needs the four names to answer on port 80 at
# /.well-known/acme-challenge/ before any TLS config can reference a cert that
# does not yet exist.
#
# Install this first, get the cert, then replace it with oddfusion.conf.
#
# Deliberately does NOT redirect to https yet: there is nothing listening for
# these names on 443 until the certificate exists, so redirecting first would
# make the site unreachable during issuance.

server {
    listen 80;
    listen [::]:80;
    server_name oddfusion.ai www.oddfusion.ai oddfusionai.com www.oddfusionai.com;

    # ACME HTTP-01 challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Serve the apex site over plain HTTP in the meantime so the box is not
    # showing the stock nginx welcome page while the cert is being issued.
    root /var/www/oddfusion.ai;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
