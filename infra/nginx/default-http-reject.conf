# Shared host hygiene: port 80 catch-all.
#
# Replaces the stock Debian/Ubuntu `sites-available/default`, which answered any
# unknown Host on port 80 with HTTP 200 and the "Welcome to nginx!" page. That
# tells a scanner the box is nginx, default-configured, and therefore probably
# hosts other vhosts worth enumerating. Now that one of the sites here is
# publicly advertised, that is free reconnaissance.
#
# 444 is nginx's "close the connection without a response". Nothing to
# fingerprint, nothing to parse.
#
# This only affects requests whose Host matches no other server_name.
# oddfusion.ai, tenkif.com, tripplansai.com and their www forms all match their
# own blocks and are unaffected.
#
# The ACME location is kept deliberately. certbot's nginx authenticator works
# inside each site's own block, but the stock default was also the historical
# webroot at /var/www/html, and silently removing that path could break a
# renewal that quietly depends on it. Keeping it costs nothing; a broken
# renewal on a production site costs a lot. `certbot renew --dry-run` is run
# after installing this to prove all three certs still renew.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 444;
    }
}
