# ODD FUSION — oddfusion.ai static site.
#
# Canonical host is the APEX, https://oddfusion.ai. Everything else 301s to it.
#
# This file is the authority for these four names and is kept in the repo, so
# certbot is run with `certonly --webroot` rather than `--nginx`: the --nginx
# installer rewrites server blocks in place, which would silently make the copy
# on the box diverge from the copy here.
#
# This block is additive. It does not touch, reorder or disable the other sites
# on this host (tenkif.com and tripplansai.com), and it does not claim
# default_server for any port.
#
# HTTP/2 is deliberately NOT enabled. This box runs nginx 1.24, where `http2` is
# a parameter of the *listen socket* rather than a per-server directive, so
# turning it on for oddfusion.ai would turn it on for everything else sharing
# 0.0.0.0:443 -- tenkif.com and tripplansai.com, which run HTTP/1.1 today.
# Silently changing the protocol for two production sites to shave milliseconds
# off one static page is not a trade worth making. (`http2 on;` as a server-level
# directive only exists from nginx 1.25.1.)
#
# Caching uses `expires`, not `add_header Cache-Control`. nginx only inherits
# add_header into a location that declares none of its own, so a per-location
# Cache-Control silently drops every security header set at server level. That
# is not theoretical: it was live here, and the homepage was served without
# X-Frame-Options or Referrer-Policy until this was restructured. `expires`
# sets Cache-Control without touching add_header inheritance.

# ---------------------------------------------------------------------------
# 1. HTTP -> HTTPS for all four names.
#    ACME challenges stay on HTTP so renewals keep working.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name oddfusion.ai www.oddfusion.ai oddfusionai.com www.oddfusionai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://oddfusion.ai$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. Typo-catcher domain. Never serves content, on purpose.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oddfusionai.com www.oddfusionai.com;

    ssl_certificate     /etc/letsencrypt/live/oddfusion.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddfusion.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://oddfusion.ai$request_uri;
}

# ---------------------------------------------------------------------------
# 3. www -> apex.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.oddfusion.ai;

    ssl_certificate     /etc/letsencrypt/live/oddfusion.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddfusion.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://oddfusion.ai$request_uri;
}

# ---------------------------------------------------------------------------
# 4. The site itself.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oddfusion.ai;

    ssl_certificate     /etc/letsencrypt/live/oddfusion.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddfusion.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/oddfusion.ai;
    index index.html;

    # --- security headers, declared once and inherited everywhere -----------

    # HSTS. One year, subdomains included.
    #
    # Deliberately NOT `preload`. Preloading is effectively irreversible once
    # browsers ship the list, and it would commit every future oddfusion.ai
    # subdomain to HTTPS before any of them exist. Add it later, on purpose,
    # not as a default.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy.
    #
    # `default-src 'none'` means anything not named below is refused outright,
    # so a future injected <script src=...>, <iframe>, <object> or beacon simply
    # does not load. What the page genuinely needs is narrow: its own image,
    # Google's font stylesheet, Google's font files, and its own inline style
    # and script blocks.
    #
    # 'unsafe-inline' is present for script-src and style-src because the page
    # keeps both inline, and it is a deliberate choice rather than an oversight.
    # A hash would be stronger, but the very next planned edit to this page is
    # setting ENDPOINT inside that inline script -- a hash would turn that edit
    # into a silently broken form. Even with 'unsafe-inline', the policy still
    # blocks external script loading, framing, base-tag hijacking, and
    # exfiltration to any origin not listed in connect-src.
    #
    # >>> WHEN YOU SET ENDPOINT: the form posts with fetch(), so the form
    # >>> service's origin must be added to connect-src or the submission will
    # >>> be blocked by this policy. e.g. connect-src 'self' https://formspree.io;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; connect-src 'self'" always;

    # --- caching -------------------------------------------------------------

    # Short for the document: this is a marketing page whose copy changes, and a
    # stale headline is worse than a revalidation round-trip.
    location = / {
        expires 5m;
        try_files /index.html =404;
    }

    location = /index.html {
        expires 5m;
    }

    # Long for images. 30 days rather than a year+immutable: preview.png is a
    # stable, un-fingerprinted filename, so an immutable year would make
    # replacing the Open Graph image effectively impossible for anyone who had
    # already fetched it. 30 days is "long" without being a trap.
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
